er:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;margin:5px 0}.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1}.section-item{padding:12px;border-radius:12px;margin:5px 0;cursor:pointer}.section-item.active{background:#191a1d;color:#fff}.table{width:100%;border-collapse:collapse}.table th{color:#8b8d92;text-align:left;font-size:11px;text-transform:uppercase;padding:13px 10px;border-bottom:1px solid var(--line)}.table td{padding:14px 10px;border-bottom:1px solid #eff0f0}.tag{border-radius:99px;padding:5px 9px;font-size:11px;background:#edf4f0;color:#3c6d60}.empty{padding:50px 20px;text-align:center;color:#777}.stat{padding:16px;border-radius:17px;background:#f5f6f5;min-width:145px}.stat b{font:800 22px Manrope;display:block}.record{display:grid;grid-template-columns:260px 1fr;gap:15px}.patient-list{padding:14px;max-height:700px;overflow:auto}.patient-item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.patient-item.active{background:#eff6f5;border-radius:12px;border:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.formgrid label{font-size:12px;color:#64676c}.full{grid-column:1/-1}.medical textarea{min-height:70px;resize:vertical}.muted{color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(22,24,27,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.dialog{background:#fff;width:min(660px,100%);max-height:92vh;overflow:auto;border-radius:25px;padding:22px;box-shadow:0 20px 55px rgba(0,0,0,.2)}.dialog h2{font:800 21px Manrope;margin:0 0 16px}.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.notice{padding:12px 14px;background:#fff6de;border-radius:12px;color:#816023;margin-bottom:12px}.toast{position:fixed;right:24px;bottom:24px;background:#1c1d20;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:100}.toast.show{display:block}.signature{height:105px;bo </style></head><body><div class="app"><header class="top"><div class="brand"><i>✦</i>Denta Atelier</div><button class="pill" onclick="show('clinic')">Clinică · Centrală</button><nav class="nav"><button class="active" data-page="calendar" onclick="show('calendar')">Calendar</button><button data-page="tariffs" onclick="show('tariffs')">Tarife</button><button data-page="patients" onclick="show('patients')">Pacienți</button><button data-page="records" onclick="show('records')">Cartea medicală</button></nav><div id="dbBadge" class="db-status syncing" onclick="showDbModal()" title="Status conexiune bază de date"><span class="dot"></span><span id="dbBadgeText">Conectare DB...</span></div><input class="search" placeholder="Caută pacient…" oninput="globalSearch(this.value)"><div class="avatar" title="Administrator">AM</div><button class="soft" title="Setări bază de date & Backup" onclick="showDbModal()">⚙</button></header><main class="page"><section id="calendar" class="view active"><div class="toolbar card"><button class="soft" onclick="shiftWeek(-1)">‹</button><button class="soft" onclick="today()">Azi</button><button class="soft" onclick="shiftWeek(1)">›</button><h1 id="calendarTitle">Săptămâna 5–11 octombrie</h1><div class="mode"><button class="active" onclick="setMode('day',this)">Zi</button><button class="active" onclick="setMode('week',this)">Săptămână</button><button onclick="setMode('month',this)">Lună</button></div><button class="black" onclick="openAppointment()">＋ Programare</button></div><div class="calendar-layout"><div class="calendar card"><div class="days" id="dayheads"></div><div class="timegrid" id="timegrid"></div></div><aside class="side card"><h3>Octombrie 2026</h3><div class="mini" id="mini"></div><div class="today-list"><p>AZI · LUNI</p><strong>Următoarele programări</strong><div id="nextAppts" class="muted" style="margin-top:12px;font-size:12px"></div></div><button class="soft" style="width:100%;margin-top:15px" onclick="clearWeek()">Golește săptămâna</button></aside></div></section><section id="patients" class="view"><div class="toolbar card"><h1>Pacienți</h1><input class="field" style="max-width:270px" placeholder="Caută după nume sau telefon" oninput="renderPatients(this.value)"><label class="muted"><input type="checkbox" onchange="renderPatients()"> Doar pacienții mei</label><button class="soft" onclick="exportVisits()">Exportă jurnalul</button><button class="black" onclick="openPatient()">＋ Pacient nou</button></div><div class="section card"><div class="row"><b id="patientCount">0 pacienți</b><span class="grow"></span></div><table class="table"><thead><tr><th>Nume</th><th>Telefon</th><th>Sex</th><th>Vârstă</th><th></th></tr></thead><tbody id="patientRows"></tbody></table></div></section><section id="tariffs" class="view"><div class="toolbar card"><h1>Tarife și devize</h1><button class="black" onclick="openPlan()">Generează deviz</button></div><div class="split"><aside class="leftpanel card"><div class="row"><b>Secțiuni</b><button class="soft" onclick="addSection()">＋</button></div><input class="field" placeholder="Caută serviciu" oninput="renderTariffs(this.value)"><div id="sectionList"></div></aside><div class="section card"><div class="row"><h2 id="tariffTitle" style="font:800 21px Manrope;margin:0">Tarife</h2><span class="grow"></span><button class="soft" onclick="openService()">＋ Serviciu</button></div><div id="serviceList"></div></div></div></section><section id="records" class="view"><div class="toolbar card"><h1>Cartea medicală</h1><button class="soft" onclick="downloadPdf()">Exportă PDF</button><button class="black" onclick="saveRecord()">Salvează</button></div><div class="record"><aside class="patient-list card"><input class="field" placeholder="Filtrează pacienți" oninput="renderRecordPatients(this.value)"><div id="recordPatients"></div></aside><article class="section card medical" id="recordEditor"></article></div></section><section id="clinic" class="view"><div class="toolbar card"><h1>Administrare clinică</h1><button class="black" onclick="openDoctor()">＋ Medic</button></div><div class="section card"><div class="tabline"><button class="active" onclick="clinicTab('clinic',this)">Clinică</button><button onclick="clinicTab('team',this)">Medici și salarii</button><button onclick="clinicTab('templates',this)">Șabloane</button><button onclick="clinicTab('profile',this)">Profil</button></div><div id="clinicContent"></div></div></section></main></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div id="toast" class="toast"></div><script>
const seed={clinic:{name:'Denta Atelier Centrală',address:'Strada Exemplu 10, Chișinău',taxId:'1024600033211',phone:'+373 22 456 880',hours:['08:00','18:00'],lunch:['13:00','14:00']},settings:{step:30,duration:60},patients:[{id:'p1',first:'Mara',last:'Exemplu',phone:'060 000 101',sex:'F',birth:1992,nid:'2001018123456',owner:'u1',status:'open'},{id:'p2',first:'Tudor',last:'Demo',phone:'060 000 102',sex:'M',birth:1985,nid:'2002022123441',owner:'u1',status:'open'},{id:'p3',first:'Sofia',last:'Test',phone:'060 000 103',sex:'F',birth:1996,nid:'',owner:'u2',status:'locked',shared:true}],appointments:[{id:'a1',patient:'p1',start:'2026-10-05T09:00',end:'2026-10-05T10:00'},{id:'a2',patient:'p2',start:'2026-10-06T11:30',end:'2026-10-06T12:15'},{id:'a3',patient:'p1',start:'2026-10-08T14:00',end:'2026-10-08T15:30'}],sections:[{id:'s1',name:'Terapie'},{id:'s2',name:'Chirurgie'},{id:'s3',name:'Ortodonție'}],services:[{id:'x1',section:'s1',name:'Consultație inițială',price:350},{id:'x2',section:'s1',name:'Obturație compozit',price:1200},{id:'x3',section:'s2',name:'Extracție simplă',price:800},{id:'x4',section:'s3',name:'Control aparat dentar',price:500}],doctors:[{id:'u1',first:'Medic',last:'Demo',email:'medic.demo@example.invalid',phone:'060 000 201',role:'Administrator',salary:{mode:'percent',percentage:35,fixed:0}},{id:'u2',first:'Doctor',last:'Test',email:'doctor.test@example.invalid',phone:'060 000 202',role:'Medic',salary:{mode:'hybrid',percentage:25,fixed:8000}}],records:{p1:{diagnostic:'Caria dentară simplă, 2.6',complaints:'Sensibilitate la rece.',notes:'Control peste 6 luni.'},p2:{diagnostic:'Gingivită catarală',complaints:'Sângerare gingivală.',notes:'Igienizare profesională recomandată.'}},templates:[{name:'Consultație de rutină',fields:'diagnostic,complaints,notes',text:'Examinare clinică efectuată. Recomandări oferite pacientului.'}],quick:[{field:'complaints',text:'Pacientul nu acuză dureri spontane.'}]};
let db=JSON.parse(localStorage.getItem('dentaAtelierDB')||'null')||seed, selectedDate=new Date('2026-10-05T10:00'), selectedPatient='p1', selectedSection='s1', editingAppointment=null, plan=[];
let dbBadgeState='syncing';function updateDbBadge(s,t){dbBadgeState=s;let b=q('dbBadge'),e=q('dbBadgeText');if(!b||!e)return;b.className='db-status '+s;e.textContent=t||(s==='connected'?'SQLite conectat':s==='syncing'?'Sincronizare...':'Mod Offline')}
async function save(){localStorage.setItem('dentaAtelierDB',JSON.stringify(db));try{updateDbBadge('syncing','Se salvează...');let r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(r.ok){updateDbBadge('connected','SQLite conectat')}else{updateDbBadge('offline','Mod Offline')}}catch(e){updateDbBadge('offline','Mod Offline')}}
async function loadFromDb(){updateDbBadge('syncing','Conectare DB...');try{let r=await fetch('/api/data');if(r.ok){let d=await r.json();if(d&&d.clinic&&Array.isArray(d.patients)){db=d;localStorage.setItem('dentaAtelierDB',JSON.stringify(db));updateDbBadge('connected','SQLite conectat');refreshActiveView();return}}}catch(e){console.warn('Eroare conexiune DB:',e)}updateDbBadge('offline','Mod Offline');refreshActiveView()}
function refreshActiveView(){let b=document.querySelector('.nav button.active'),p=b?b.dataset.page:'calendar';renderCalendar();renderPatients();if(p==='tariffs')renderTariffs();if(p==='records')renderRecord();if(p==='clinic')renderClinic()}
function showDbModal(){let c=dbBadgeState==='connected';modal(`<h2>⚙ Administrare bază de date</h2><div class="stat" style="margin-bottom:14px"><small>Stare conexiune</small><b style="color:${c?'#166534':'#b45309'}">${c?'● SQLite Locală Activă (denta_atelier.db)':'○ Mod Offline (LocalStorage)'}</b><span class="muted" style="font-size:12px;margin-top:6px;display:block">${c?'Toate modificările se salvează în baza de date SQLite locală. Oricare alt computer sau tabletă din clinică vede aceleași date în timp real.':'Serverul local nu a răspuns. Datele sunt stocate temporar în memoria browserului.'}</span></div><div class="row wrap" style="gap:10px;margin-bottom:18px"><button class="soft" onclick="downloadBackup()">📥 Descarcă Backup JSON</button><button class="soft" onclick="loadFromDb();closeModal();toast('Reîncărcare din baza de date...')">🔄 Reîncarcă din DB</button><button class="soft" style="color:#c64d45" onclick="resetDb()">⚠️ Resetează la datele inițiale</button></div><div class="notice"><b>💡 Ghid pentru publicare online:</b><br>• <b>Local (Clinică):</b> Baza de date SQLite integrată funcționează direct pe PC-ul clinicii fără bătăi de cap.<br>• <b>Online (Internet):</b> Pentru acces de oriunde (mobil, acasă), se recomandă găzduirea pe un cloud precum <b>Render</b>, <b>Railway</b> sau <b>Fly.io</b> conectat la o bază de date <b>PostgreSQL</b> (ex: Supabase sau Neon).</div><div class="footer-actions"><button class="black" onclick="closeModal()">Închide</button></div>`)}
function downloadBackup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='denta_atelier_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Copia de rezervă JSON a fost descărcată.')}
async function resetDb(){if(confirm('Sigur resetați toate datele la starea demonstrativă inițială?')){try{let r=await fetch('/api/reset',{method:'POST'});if(r.ok){toast('Baza de date a fost resetată.');await loadFromDb();closeModal();return}}catch(e){}db=JSON.parse(JSON.stringify(seed));save();closeModal();refreshActiveView();toast('Datele au fost resetate.')}}
function q(id){return document.getElementById(id)}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function toast(t){q('toast').textContent=t;q('toast').classList.add('show');setTimeout(()=>q('toast').classList.remove('show'),2600)}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));q(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='patients')renderPatients();if(id==='tariffs')renderTariffs();if(id==='records')renderRecord();if(id==='clinic')renderClinic()}
function iso(d){return d.toISOString().slice(0,10)}function addMin(dt,n){let d=new Date(dt);d.setMinutes(d.getMinutes()+n);return dt.slice(0,10)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function monday(d){let x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function fmtDate(d){return d.toLocaleDateString('ro-RO',{month:'long',day:'numeric'})}function today(){selectedDate=new Date('2026-10-05T10:00');renderCalendar()}function shiftWeek(n){selectedDate.setDate(selectedDate.getDate()+n*7);renderCalendar()}function setMode(m,b){document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(m==='month'?'Vizualizarea lunară este disponibilă prin mini-calendar.':'Vizualizarea '+(m==='day'?'zilei':'săptămânii')+' activată')}
function renderCalendar(){let m=monday(selectedDate),days=[...Array(7)].map((_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d});q('calendarTitle').textContent='Săptămâna '+fmtDate(days[0])+' – '+fmtDate(days[6]);q('dayheads').innerHTML='<div></div>'+days.map(d=>`<div class="dayhead ${iso(d)==='2026-10-05'?'today':''}"><small>${d.toLocaleDateString('ro-RO',{weekday:'short'})}</small><span>${d.getDate()}</span></div>`).join('');q('timegrid').innerHTML=Array.from({length:24},(_,i)=>`<div class="time" style="grid-row:${i+1}">${String(i).padStart(2,'0')}:00</div>`).join('')+days.map((d,i)=>`<div class="slot ${d.getDay()!==0&&d.getDay()!==6?'work':''}" data-date="${iso(d)}" style="grid-column:${i+2};grid-row:1/25" onclick="slotClick(event,this)"></div>`).join('');db.appointments.forEach(a=>{let d=a.start.slice(0,10),slot=document.querySelector('.slot[data-date="'+d+'"]');if(!slot)return;let st=new Date(a.start),en=new Date(a.end),p=db.patients.find(x=>x.id===a.patient);let top=(st.getHours()*60+st.getMinutes())/2,height=Math.max(32,(en-st)/60000/2);slot.insertAdjacentHTML('beforeend',`<div class="appt" style="top:${top}px;height:${height}px" onclick="event.stopPropagation();openAppointment('${a.id}')"><strong>${esc(p?.last)} ${esc(p?.first)}</strong><small>${st.toTimeString().slice(0,5)}–${en.toTimeString().slice(0,5)} · ${mask(p?.phone)}</small></div>`)});q('mini').innerHTML=['L','M','M','J','V','S','D'].map(x=>'<span>'+x+'</span>').join('')+Array.from({length:31},(_,i)=>'<b class="'+(i===4?'sel':'')+'">'+(i+1)+'</b>').join('');q('nextAppts').innerHTML=db.appointments.filter(a=>a.start.startsWith('2026-10-05')).map(a=>{let p=db.patients.find(x=>x.id===a.patient);return '<p><b>'+a.start.slice(11,16)+'</b> · '+esc(p.last+' '+p.first)+'</p>'}).join('')||'Nicio programare azi.'}function mask(x=''){return x?x.slice(0,4)+' ••• '+x.slice(-3):''}function slotClick(e,slot){let r=slot.getBoundingClientRect(),min=Math.round(((e.clientY-r.top)*2)/db.settings.step)*db.settings.step;min=Math.max(0,Math.min(1380,min));let start=slot.dataset.date+'T'+String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');openAppointment(null,start)}function clearWeek(){if(confirm('Ștergi toate programările din săptămâna afișată?')){let m=iso(monday(selectedDate)),end=iso(new Date(monday(selectedDate).getTime()+7*864e5));db.appointments=db.appointments.filter(a=>a.start.slice(0,10)<m||a.start.slice(0,10)>=end);save();renderCalendar();toast('Săptămâna a fost golită.')}}
function modal(html){q('dialog').innerHTML=html;q('modal').classList.add('show')}function closeModal(){q('modal').classList.remove('show')}q('modal').onclick=e=>{if(e.target===q('modal'))closeModal()};function openAppointment(id,start){let a=id?db.appointments.find(x=>x.id===id):null;editingAppointment=id;let dt=a?.start||start||iso(selectedDate)+'T09:00',end=a?.end||addMin(dt,db.settings.duration);modal(`<h2>${a?'Editează programarea':'Programare nouă'}</h2><div class="formgrid"><label>Data<input id="apDate" class="field" type="date" value="${dt.slice(0,10)}"></label><label>Pacient<input id="apPatient" class="field" list="plist" value="${a?patientName(a.patient):''}" placeholder="Caută sau scrie un pacient"></label><datalist id="plist">${db.patients.map(p=>'<option value="'+esc(patientName(p.id))+'">').join('')}</datalist><label>Început<input id="apStart" class="field" type="time" step="300" value="${dt.slice(11,16)}"></label><label>Sfârșit<input id="apEnd" class="field" type="time" step="300" value="${end.slice(11,16)}"></label><div class="full row wrap">${[15,30,45,60,90].map(n=>'<button class="soft" onclick="preset('+n+')">'+n+' min</button>').join('')}</div></div><div class="footer-actions">${a?'<button class="soft" style="color:#c64d45" onclick="deleteAppt()">Șterge</button>':''}<button class="soft" onclick="closeModal()">Anulează</button><button class="black" onclick="saveAppt()">Salvează</button></div>`)}function preset(n){let s=q('apStart').value.split(':');let x=(+s[0]*60+ +s[1]+n)%1440;q('apEnd').value=String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function patientName(id){let p=db.patients.find(x=>x.id===id);return p?p.last+' '+p.first:''}function saveAppt(){let name=q('apPatient').value.trim(),p=db.patients.find(x=>patientName(x.id).toLowerCase()===name.toLowerCase());if(!p){if(!name){toast('Alege un pacient înainte de salvare.');return}let z=name.trim().split(/\s+/);p={id:'p'+Date.now(),last:z[0],first:z.slice(1).join(' ')||' function renderPatients(term=''){term=(term||'').toLowerCase();let arr=db.patients.filter(p=>(p.first+' '+p.last+' '+p.phone).toLowerCase().includes(term));q('patientCount').textContent=arr.length+' din '+db.patients.length+' pacienți';q('patientRows').innerHTML=arr.map(p=>`<tr><td><b>${esc(p.last+' '+p.first)}</b>${p.shared?' <span class="tag">partajat</span>':''}</td><td>${mask(p.phone)}</td><td>${p.sex}</td><td>${new Date().getFullYear()-p.birth}</td><td><button class="soft" onclick="openPatient('${p.id}')">Editează</button></td></tr>`).join('')}function openPatient(id){let p=id?db.patients.find(x=>x.id===id):{first:'',last:'',phone:'',sex:'F',birth:1990,nid:''};modal(`<h2>${id?'Editează pacient':'Pacient nou'}</h2><div class="formgrid"><label>Nume<input id="pLast" class="field" value="${esc(p.last)}"></label><label>Prenume<input id="pFirst" class="field" value="${esc(p.first)}"></label><label>Telefon<input id="pPhone" class="field" value="${esc(p.phone)}"></label><label>Sex<select id="pSex" class="field"><option ${p.sex==='F'?'selected':''}>F</option><option ${p.sex==='M'?'selected':''}>M</option></select></label><label>Anul nașterii<input id="pBirth" class="field" type="number" value="${p.birth}"></label><label>IDNP ${id?'(nu poate fi modificat)':''}<input id="pNid" class="field" ${id?'readonly':''} value="${esc(p.nid)}"></label></div><div class="footer-actions"><button class="soft" onclick="closeModal()">Anulează</button><button class="black" onclick="savePatient('${id||''}')">Salvează</button></div>`)}function savePatient(id){let last=q('pLast').value.trim(),first=q('pFirst').value.trim();if(!last||!first){toast('Numele și prenumele sunt obligatorii.');return}let obj={last,first,phone:q('pPhone').value,sex:q('pSex').value,birth:+q('pBirth').value,nid:q('pNid').value};if(id)Object.assign(db.patients.find(p=>p.id===id),obj);else db.patients.push({id:'p'+Date.now(),...obj,owner:'u1',status:'open'});save();closeModal();renderPatients();toast('Pacient salvat.')}function globalSearch(t){if(t.length>1){show('patients');renderPatients(t)}}function exportVisits(){let rows=[['Pacient','Telefon','Data','Servicii']];db.appointments.forEach(a=>{let p=db.patients.find(x=>x.id===a.patient);rows.push([patientName(p.id),p.phone,a.start.slice(0,10),'Consultație'])});let content=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),blob=new Blob([content],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jurnal-vizite.csv';a.click();toast('Jurnalul a fost exportat.')}
function renderTariffs(term=''){let sec=db.sections.find(x=>x.id===selectedSection)||db.sections[0];q('sectionList').innerHTML=db.sections.map(s=>`<div class="section-item ${s.id===sec.id?'active':''}" onclick="selectedSection='${s.id}';renderTariffs()">${esc(s.name)} <span style="float:right">${db.services.filter(x=>x.section===s.id).length}</span></div>`).join('');q('tariffTitle').textContent=sec.name;q('serviceList').innerHTML=db.services.filter(x=>x.section===sec.id&&x.name.toLowerCase().includes((term||'').toLowerCase())).map(s=>`<div class="row" style="padding:15px 4px;border-bottom:1px solid #eee"><b class="grow">${esc(s.name)}</b><strong>${s.price.toLocaleString('ro-RO')} MDL</strong><button class="soft" onclick="editService('${s.id}')">Editează</button></div>`).join('')||'<div class="empty">Nu sunt servicii în această secțiune.</div>'}function addSection(){let n=prompt('Denumirea secțiunii:');if(n){let x={id:'s'+Date.now(),name:n};db.sections.push(x);selectedSection=x.id;save();renderTariffs()}}function openService(id){let s=id?db.services.find(x=>x.id===id):{name:'',price:''};modal(`<h2>${id?'Editează serviciul':'Serviciu nou'}</h2><label>Denumire<input id="sName" class="field" value="${esc(s.name)}"></label><label>Preț MDL<input id="sPrice" class="field" type="number" value="${s.price}"></label><div class="footer-actions"><button class="soft" onclick="closeModal()">Anulează</button><button class="black" onclick="saveService('${id||''}')">Salvează</button></div>`)}function editService(id){openService(id)}function saveService(id){let o={name:q('sName').value,price:+q('sPrice').value};if(!o.name||!o.price){toast('Completează denumirea și prețul.');return}if(id)Object.assign(db.services.find(x=>x.id===id),o);else db.services.push({id:'x'+Date.now(),section:selectedSection,...o});save();closeModal();renderTariffs();toast('Serviciu salvat.')}function openPlan(){plan=[];renderPlan()}function renderPlan(){modal(`<h2>Deviz / plan de tratament</h2><label>Pacient<se function renderRecordPatients(t=''){q('recordPatients').innerHTML=db.patients.filter(p=>(p.last+' '+p.first).toLowerCase().includes(t.toLowerCase())).map(p=>`<div class="patient-item ${p.id===selectedPatient?'active':''}" onclick="selectedPatient='${p.id}';renderRecord()"><b>${esc(patientName(p.id))}</b><br><small class="muted">${p.status==='locked'?'Dosar partajat · blocat':'Dosar activ'}</small></div>`).join('')}function renderRecord(){renderRecordPatients();let p=db.patients.find(x=>x.id===selectedPatient),r=db.records[p.id]||{};if(p.status==='locked'){q('recordEditor').innerHTML=`<h2 style="font:800 22px Manrope">${esc(patientName(p.id))}</h2><div class="notice">Acest dosar este partajat de o altă clinică. Pentru a vedea și completa toate datele medicale, semnează documentele obligatorii în clinica primitoare.</div><button class="black" onclick="signWizard()">Adaugă semnătura</button>`;return}q('recordEditor').innerHTML=`<div class="row"><div><h2 style="font:800 22px Manrope;margin:0">${esc(patientName(p.id))}</h2><span class="muted">Fișă medicală activă</span></div><span class="grow"></span><select class="field" style="width:auto" onchange="applyTemplate(this.value)"><option value="">Aplică șablon…</option>${db.templates.map((t,i)=>'<option value="'+i+'">'+esc(t.name)+'</option>').join('')}</select></div><div class="formgrid" style="margin-top:18px"><label class="full">Diagnostic<textarea id="rDiagnosis" class="field">${esc(r.diagnostic)}</textarea></label><label>Acuzе<textarea id="rComplaints" class="field">${esc(r.complaints)}</textarea></label><label>Antecedente<textarea id="rHistory" class="field">${esc(r.history)}</textarea></label><label>Examen exterior<textarea id="rExterior" class="field">${esc(r.exterior)}</textarea></label><label>Starea dinților<textarea id="rTeeth" class="field">${esc(r.teeth)}</textarea></label><label>Mucoasă<textarea id="rMucosa" class="field">${esc(r.mucosa)}</textarea></label><label>Tratament și aparate<textarea id="rTreatment" class="field">${esc(r.treatment)}</textarea></label><label class="full">Recomandări și note<textarea id="rNotes" class="field">${esc(r.notes)}</textarea></label></div><div class="row"><button class="soft" onclick="quickText()">Text rapid</button><button class="soft" onclick="openPlan()">Generează deviz</button></div>`}function saveRecord(){let p=db.patients.find(x=>x.id===selectedPatient);if(p.status==='locked'){toast('Dosarul trebuie semnat înainte de editare.');return}db.records[p.id]={diagnostic:q('rDiagnosis').value,complaints:q('rComplaints').value,history:q('rHistory').value,exterior:q('rExterior').value,teeth:q('rTeeth').value,mucosa:q('rMucosa').value,treatment:q('rTreatment').value,notes:q('rNotes').value};save();toast('Fișa medicală a fost salvată.')}function quickText(){q('rComplaints').value=db.quick[0].text;toast('Text rapid aplicat.')}function applyTemplate(i){if(i==='')return;let t=db.templates[i];['rDiagnosis','rComplaints','rNotes'].forEach(id=>{if(q(id)&&!q(id).value)q(id).value=t.text});toast('Șablon aplicat.')}
function signWizard(){let p=db.patients.find(x=>x.id===selectedPatient);modal(`<h2>Semnare documente · 1 din 3</h2><p class="muted">Alege limba și confirmă documentele necesare pentru ${esc(patientName(p.id))}.</p><div class="row"><button class="soft">Română</button><button class="soft">Русский</button><button class="soft">English</button></div><label>Adresă<input class="field" placeholder="Adresa de domiciliu"></label><label>IDNP<input class="field" value="${esc(p.nid)}"></label><label>Telefon<input class="field" value="${esc(p.phone)}"></label><p><label><input type="checkbox" checked> Acord pentru semnătură electronică</label><br><label><input type="checkbox" checked> Acord informat medical</label><br><label><input type="checkbox" checked> Consimțământ pentru date medicale</label></p><div class="signature"><canvas id="sign"></canvas></div><div class="row"><button class="soft" onclick="clearSign()">Curăță semnătura</button><span class="muted">Desenează semnătura în câmp.</span></div><div class="footer-actions"><button class="black" onclick="finishSign()">Semnează și salvează PDF-uri</button></div>`);setupSign()}function setupSign(){let c=q('sign'),ctx=c.getContext('2d'),down=false;function pos(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]}c.width=700;c.height=210;ctx.lineWidth=3;ctx.lineCap='round';c.onpointerdown=e=>{down=true;ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(down){ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=()=>down=false}function clearSign(){let c=q('sign');c.getContext('2d').clearRect(0,0,c.width,c.height)}function finishSign(){db.patients.find(x=>x.id===selectedPatient).status='open';save();closeModal();renderRecord();toast('Documentele au fost semnate și dosarul este deblocat.')}
function clinicTab(tab,b){document.querySelectorAll('.tabline button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderClinic(tab)}function renderClinic(tab='clinic'){let el=q('clinicContent');if(tab==='clinic')el.innerHTML=`<div class="formgrid"><label>Denumire clinică<input id="cName" class="field" value="${esc(db.clinic.name)}"></label><label>Telefon<input id="cPhone" class="field" value="${esc(db.clinic.phone)}"></label><label>Adresă<input id="cAddress" class="field" value="${esc(db.clinic.address)}"></label><label>IDNO<input id="cTax" class="field" value="${esc(db.clinic.taxId)}"></label><label>Program de lucru<input id="cStart" class="field" type="time" value="${db.clinic.hours[0]}"></label><label>Până la<input id="cEnd" class="field" type="time" value="${db.clinic.hours[1]}"></label><label>Pauză de masă<input id="cLunch" class="field" value="${db.clinic.lunch.join(' – ')}"></label></div><div class="footer-actions"><button class="black" onclick="saveClinic()">Salvează clinica</button></div>`;else if(tab==='team')el.innerHTML=`<div class="kpi"><div class="stat"><small>Venit servicii</small><b>48 400 MDL</b></div><div class="stat"><small>Salarii estimate</small><b>15 260 MDL</b></div><div class="stat"><small>Vizite luna curentă</small><b>${db.appointments.length}</b></div></div><table class="table"><thead><tr><th>Medic</th><th>Rol</th><th>Email</th><th>Regulă salariu</th><th></th></tr></thead><tbody>${db.doctors.map(d=>`<tr><td><b>${esc(d.first+' '+d.last)}</b></td><td>${d.role}</td><td>${d.email}</td><td>${d.salary.mode==='fixed'?d.salary.fixed+' MDL':d.salary.mode==='hybrid'?d.salary.percentage+'% + '+d.salary.fixed+' MDL':d.salary.percentage+'%'}</td><td><button class="soft" onclick="salary('${d.id}')">Configurează</button></td></tr>`).join('')}</tbody></table>`;else if(tab==='templates')el.innerHTML=`<div class="row"><h3 class="grow">Texte rapide și șabloane fișă</h3><button class="black" onclick="newTemplate()">＋ Șablon</button></di function saveDoctor(){let d={id:'u'+Date.now(),first:q('dFirst').value,last:q('dLast').value,email:q('dEmail').value,phone:q('dPhone').value,role:q('dRole').value,salary:{mode:'percent',percentage:25,fixed:0}};if(!d.first||!d.last||!d.email){toast('Completează numele și emailul.');return}db.doctors.push(d);save();closeModal();renderClinic('team');modal(`<h2>Medic creat</h2><p>Parola temporară se afișează o singură dată:</p><div class="notice"><b>DA-${Math.random().toString(36).slice(2,8).toUpperCase()}</b></div><p class="muted">La prima autentificare, medicul va trebui să schimbe parola.</p><div class="footer-actions"><button class="black" onclick="closeModal()">Am notat</button></div>`)}function salary(id){let d=db.doctors.find(x=>x.id===id),s=d.salary;modal(`<h2>Salariu · ${esc(d.first+' '+d.last)}</h2><label>Model<select id="salMode" class="field"><option value="percent" ${s.mode==='percent'?'selected':''}>Procent din servicii</option><option value="hybrid" ${s.mode==='hybrid'?'selected':''}>Procent + sumă fixă</option><option value="fixed" ${s.mode==='fixed'?'selected':''}>Doar sumă fixă</option></select></label><label>Procent<select id="salPct" class="field">${[20,25,30,35,40,50].map(n=>'<option '+(s.percentage===n?'selected':'')+'>'+n+'</option>').join('')}</select></label><label>Sumă fixă MDL<input id="salFixed" class="field" type="number" value="${s.fixed}"></label><div class="notice">Exemplu pentru 20 000 MDL servicii: ${(20000*s.percentage/100+s.fixed).toLocaleString('ro-RO')} MDL</div><div class="footer-actions"><button class="black" onclick="saveSalary('${id}')">Salvează</button></div>`)}function saveSalary(id){let d=db.doctors.find(x=>x.id===id);d.salary={mode:q('salMode').value,percentage:+q('salPct').value,fixed:+q('salFixed').value};save();closeModal();renderClinic('team');toast('Regula de salariu a fost salvată.')}function newTemplate(){let n=prompt('Numele șablonului:');if(n){db.templates.push({name:n,fields:'diagnostic, complaints, notes',text:''});save();renderClinic('templates')}}
async function downloadPdf(content){let text=content||'Fișă medicală — '+patientName(selectedPatient)+'\n\n'+JSON.stringify(db.records[selectedPatient]||{},null,2);try{let r=await fetch('/export-pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw 0;let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='denta-atelier-document.pdf';a.click();toast('Document PDF generat.')}catch{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='denta-atelier-document.txt';a.click();toast('Serverul de export nu rulează; s-a descărcat textul documentului.')}}
async function exportVisits(){let rows=db.appointments.map(a=>{let p=db.patients.find(x=>x.id===a.patient);return[patientName(p.id),p.phone,a.start.slice(0,10),'Consultație']});try{let r=await fetch('/export-visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});if(!r.ok)throw 0;let a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='jurnal-vizite.xlsx';a.click();toast('Jurnalul XLSX a fost exportat.')}catch{let content=[['Pacient','Telefon','Data','Servicii'],...rows].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'}));a.download='jurnal-visite.csv';a.click();toast('Serverul de export nu rulează; s-a descărcat CSV.')}}renderCalendar();renderPatients();

<script>
/* Completează controalele administrative ale fluxului de lucru SmartMed. */
(function(){
  const basePatients=renderPatients;
  renderPatients=function(term=''){
    term=(term||'').toLowerCase();
    const mine=document.querySelector('#patients input[type=checkbox]')?.checked;
    const arr=db.patients.filter(p=>(!mine||p.owner==='u1')&&(p.first+' '+p.last+' '+p.phone).toLowerCase().includes(term));
    q('patientCount').textContent=arr.length+' din '+db.patients.length+' pacienți';
    q('patientRows').innerHTML=arr.map(p=>`<tr><td><b>${esc(p.last+' '+p.first)}</b>${p.shared?' <span class="tag">partajat</span>':''}</td><td>${mask(p.phone)}</td><td>${p.sex}</td><td>${new Date().getFullYear()-p.birth}</td><td><button class="soft" onclick="openPatient('${p.id}')">Editează</button> <button class="soft danger" onclick="deletePatient('${p.id}')">Șterge</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nu s-au găsit pacienți.</td></tr>';
  };
  window.deletePatient=function(id){const p=db.patients.find(x=>x.id===id);if(!p||!confirm('Ștergi pacientul '+patientName(id)+' și programările sale?'))return;db.patients=db.patients.filter(x=>x.id!==id);db.appointments=db.appointments.filter(x=>x.patient!==id);delete db.records[id];if(selectedPatient===id)selectedPatient=db.patients[0]?.id;save();renderPatients();renderCalendar();toast('Pacientul a fost șters.');};
  window.saveClinicExtras=function(){db.clinic.sms={enabled:q('smsEnabled').checked,text:q('smsText').value};db.clinic.variableHours=q('variableHours').checked;saveClinic();toast('Setările SMS și programul au fost salvate.');};
  window.previewLogo=function(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>2*1024*1024){toast('Logo-ul trebuie să fie sub 2 MB.');return}const reader=new FileReader();reader.onload=()=>{db.clinic.logo=reader.result;q('logoImage').src=reader.result;save();toast('Logo salvat pentru devize.');};reader.readAsDataURL(file);};
  window.changePassword=function(){modal(`<h2>Schimbă parola</h2><label>Parola actuală<input id="oldPwd" class="field" type="password" autocomplete="current-password"></label><label>Parola nouă<input id="newPwd" class="field" type="password" autocomplete="new-password"></label><div class="footer-actions"><button class="soft" onclick="closeModal()">Anulează</button><button class="black" onclick="finishPasswordChange()">Salvează parola</button></div>`)};
  window.finishPasswordChange=function(){if(q('newPwd').value.length<8){toast('Parola nouă trebuie să conțină minimum 8 caractere.');return}closeModal();toast('Parola a fost schimbată pentru acest profil.');};
  const baseClinic=renderClinic;
  renderClinic=function(tab='clinic'){
    baseClinic(tab);
    if(tab==='clinic'){
      const sms=db.clinic.sms||{enabled:false,text:'{pacient}, vă așteptăm {ziua} la ora {ora} la {clinica}, dr. {medic}. Adresa: {adresa}. Tel: {telefon}'};
      q('clinicContent').insertAdjacentHTML('beforeend',`<div class="clinic-block"><h3>Program de lucru</h3><label class="toggle-line"><input id="variableHours" type="checkbox" ${db.clinic.variableHours?'checked':''}> Program diferit pe zile</label><p class="muted">Intervalele din calendar vor indica orele indisponibile; pauza rămâne doar o indicație.</p></div><div class="clinic-block"><h3>Notificări SMS</h3><label class="toggle-line"><input id="smsEnabled" type="checkbox" ${sms.enabled?'checked':''}> Trimite reminder SMS pacienților</label><p class="muted">Reminderul este pregătit cu o zi înainte la ora 10:00. Mesajele nu sunt expediate automat din această instalare locală.</p><label>Textul SMS<textarea id="smsText" class="field" rows="3">${esc(sms.text)}</textarea></label><p class="muted">Variabile disponibile: {pacient}, {ziua}, {data}, {ora}, {medic}, {clinica}, {adresa}, {telefon}.</p></div><div class="clinic-block"><h3>Logo pentru tipar</h3><div class="row"><img id="logoImage" class="logo-preview" src="${db.clinic.logo||''}" alt="Previzualizare logo"><label class="soft">Încarcă logo<input type="file" accept="image/png,image/jpeg" hidden onchange="previewLogo(this)"></label><span class="muted">PNG sau JPG, max. 2 MB. Apare pe deviz.</span></div></div><div class="footer-actions"><button class="black" onclick="saveClinicExtras()">Salvează toate setările</button></div>`);
    }
    if(tab==='profile') q('clinicContent').insertAdjacentHTML('beforeend','<div class="clinic-block"><h3>Parolă</h3><p class="muted">Schimbă parola folosind parola actuală.</p><button class="soft" onclick="changePassword()">Schimbă parola</button></div>');
  };
  let calendarMode='week';
  const baseCalendar=renderCalendar;
  window.setMode=function(mode, button){calendarMode=mode;document.querySelectorAll('.mode button').forEach(x=>x.classList.toggle('active',x===button));baseCalendar();if(mode==='month')renderMonth();if(mode==='day')renderDay();};
  function renderDay(){const weekStart=monday(selectedDate), index=(selectedDate.getDay()+6)%7;const heads=[...q('dayheads').children];const slots=[...q('timegrid').querySelectorAll('.slot')];heads.forEach((el,i)=>el.style.display=(i===0||i===index+1)?'block':'none');slots.forEach((el,i)=>el.style.display=i===index?'block':'none');q('dayheads').style.gridTemplateColumns='64px 1fr';q('timegrid').style.gridTemplateColumns='64px minmax(260px,1fr)';q('calendarTitle').textContent='Ziua de '+fmtDate(selectedDate);}
  function renderMonth(){const root=document.querySelector('#calendar .calendar');const first=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1), start=monday(first), todayKey='2026-10-05';q('calendarTitle').textContent=selectedDate.toLocaleDateString('ro-RO',{month:'long',year:'numeric'});root.innerHTML='<div class="days">'+['L','M','M','J','V','S','D'].map(x=>'<div class="dayhead">'+x+'</div>').join('')+'</div><div class="month-grid">'+Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),own=d.getMonth()===selectedDate.getMonth(),items=db.appointments.filter(a=>a.start.slice(0,10)===key).map(a=>'<span class="month-appt">'+esc(patientName(a.patient))+' · '+a.start.slice(11,16)+'</span>').join('');return '<div class="month-day '+(!own?'muted ':'')+(key===todayKey?'today':'')+'" onclick="selectedDate=new Date(\''+key+'T09:00\');setMode(\'day\',document.querySelector(\'.mode button\'));"><b>'+d.getDate()+'</b>'+items+'</div>';}).join('')+'</div>';}
  const originalShift=shiftWeek; window.shiftWeek=function(n){selectedDate.setDate(selectedDate.getDate()+(calendarMode==='month'?n*31:n*7));baseCalendar();if(calendarMode==='month')renderMonth();if(calendarMode==='day')renderDay();};
  renderPatients();
})();
</script>
<script>
/* Supabase cloud persistence and authentication. Kept here so the rest of the
   existing interface can continue to use the same `db` object. */
(function () {
  const cloud = window.dentaSupabase;
  let currentProfile = null;
  if (!cloud?.configured()) return;

  function showLoginGate(message = 'Conectează-te cu contul administratorului pentru a accesa clinica.') {
    let gate = q('authGate');
    if (!gate) {
      const style = document.createElement('style');
      style.textContent = '#authGate{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#e8f3f8,#d9d5ef);display:grid;place-items:center;padding:20px}#authGate .auth-card{width:min(420px,100%);padding:30px;border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 24px 64px rgba(29,49,71,.25);border:1px solid rgba(255,255,255,.85)}#authGate h1{font:800 26px Manrope;margin:0 0 8px}#authGate p{margin:0 0 16px}';
      document.head.appendChild(style);
      gate = document.createElement('div');
      gate.id = 'authGate';
      document.body.appendChild(gate);
    }
    gate.innerHTML = `<div class="auth-card"><div class="brand"><i>✦</i>Denta Atelier</div><h1>Autentificare</h1><p class="muted" id="authGateMessage"></p><label>Email<input id="gateEmail" class="field" type="email" autocomplete="email" required></label><label>Parolă<input id="gatePassword" class="field" type="password" autocomplete="current-password" required></label><div class="footer-actions"><button class="black" onclick="submitSupabaseAuth('signin',true)">Intră în aplicație</button></div></div>`;
    q('authGateMessage').textContent = message;
    gate.style.display = 'grid';
  }

  function hideLoginGate() {
    const gate = q('authGate');
    if (gate) gate.style.display = 'none';
  }

  function cloudUserLabel() {
    return cloud.session?.user?.email || 'utilizator conectat';
  }

  async function loadFromSupabase() {
    updateDbBadge('syncing', 'Conectare Supabase...');
    try {
      currentProfile = await cloud.getProfile();
      if (!currentProfile?.approved || currentProfile.role !== 'admin') {
        await cloud.signOut();
        currentProfile = null;
        updateDbBadge('offline', 'Acces restricționat');
        showLoginGate('Acest cont nu are acces. Aplicația este rezervată administratorului clinicii.');
        return false;
      }
      const remote = await cloud.loadState();
      if (remote?.clinic && Array.isArray(remote.patients)) {
        db = remote;
        localStorage.setItem('dentaAtelierDB', JSON.stringify(db));
      } else {
        await cloud.saveState(db);
      }
      updateDbBadge('connected', 'Supabase conectat');
      hideLoginGate();
      refreshActiveView();
      return true;
    } catch (error) {
      console.error('Supabase:', error);
      updateDbBadge('offline', 'Configurare DB necesară');
      toast('Supabase nu este pregătit. Rulează migrarea SQL din proiect.');
      return false;
    }
  }
  window.loadFromSupabase = loadFromSupabase;

  save = async function () {
    localStorage.setItem('dentaAtelierDB', JSON.stringify(db));
    if (!cloud.session || !currentProfile?.approved) {
      updateDbBadge('offline', 'Autentificare necesară');
      return;
    }
    try {
      updateDbBadge('syncing', 'Se salvează în Supabase...');
      await cloud.saveState(db);
      updateDbBadge('connected', 'Supabase conectat');
    } catch (error) {
      console.error('Eroare salvare Supabase:', error);
      updateDbBadge('offline', 'Salvare locală temporară');
      toast('Modificarea este păstrată local; verifică conexiunea Supabase.');
    }
  };

  window.showSupabaseLogin = function () {
    closeModal();
    showLoginGate();
  };

  window.submitSupabaseAuth = async function (action, fromGate = false) {
    const email = q(fromGate ? 'gateEmail' : 'sbEmail').value.trim();
    const password = q(fromGate ? 'gatePassword' : 'sbPassword').value;
    if (!email || password.length < 8) {
      toast('Introdu un email valid și o parolă de cel puțin 8 caractere.');
      return;
    }
    try {
      await cloud.signIn(email, password);
      closeModal();
      const loaded = await loadFromSupabase();
      if (loaded) toast('Conectat: ' + cloudUserLabel());
    } catch (error) {
      console.error('Autentificare Supabase:', error);
      toast('Conectarea a eșuat. Verifică emailul și parola.');
    }
  };

  showDbModal = function () {
    const connected = dbBadgeState === 'connected';
    const signedIn = Boolean(cloud.session);
    modal(`<h2>☁️ Baza de date Supabase</h2><div class="stat" style="margin-bottom:14px"><small>Stare conexiune</small><b style="color:${connected ? '#166534' : '#b45309'}">${connected ? '● Supabase activ' : '○ Neconectat'}</b><span class="muted" style="font-size:12px;margin-top:6px;display:block">${signedIn ? 'Cont administrator: ' + esc(cloudUserLabel()) : 'Conectează-te cu contul administratorului.'}</span></div><div class="row wrap" style="gap:10px;margin-bottom:18px"><button class="soft" onclick="downloadBackup()">📥 Backup JSON</button><button class="soft" onclick="loadFromSupabase();closeModal()" ${currentProfile?.role === 'admin' ? '' : 'disabled'}>🔄 Reîncarcă</button>${signedIn ? '<button class="soft" onclick="logoutSupabase()">Deconectare</button>' : '<button class="black" onclick="showSupabaseLogin()">Conectare</button>'}</div><div class="notice">Accesul este rezervat exclusiv administratorului clinicii.</div><div class="footer-actions"><button class="black" onclick="closeModal()">Închide</button></div>`);
  };

  window.manageClinicUsers = async function () {
    try {
      const users = await cloud.listUsers();
      const rows = users.map(user => `<tr><td>${esc(user.email)}</td><td>${user.role === 'admin' ? 'Administrator' : 'Membru'}</td><td>${user.approved ? '<span class="tag">Aprobat</span>' : '<span class="muted">În așteptare</span>'}</td><td>${!user.approved ? `<button class="black" onclick="approveClinicUser('${user.id}')">Aprobă</button>` : ''}</td></tr>`).join('');
      modal(`<h2>Conturi clinică</h2><p class="muted">Doar administratorul poate aproba accesul la datele clinicii.</p><table class="table"><thead><tr><th>Email</th><th>Rol</th><th>Stare</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">Nu există conturi.</td></tr>'}</tbody></table><div class="footer-actions"><button class="black" onclick="closeModal()">Închide</button></div>`);
    } catch (error) {
      console.error('Listă utilizatori:', error);
      toast('Nu s-au putut încărca conturile clinicii.');
    }
  };

  window.approveClinicUser = async function (userId) {
    try {
      await cloud.approveUser(userId);
      toast('Cont aprobat.');
      await window.manageClinicUsers();
    } catch (error) {
      console.error('Aprobare utilizator:', error);
      toast('Aprobarea nu a reușit.');
    }
  };

  window.logoutSupabase = async function () {
    await cloud.signOut();
    closeModal();
    currentProfile = null;
    updateDbBadge('offline', 'Autentificare necesară');
    showLoginGate();
    toast('Te-ai deconectat. Datele locale nu au fost șterse.');
  };

  window.changePassword = function (invitation = false) {
    modal(`<h2>${invitation ? 'Alege parola administratorului' : 'Schimbă parola'}</h2><p class="muted">Parola trebuie să aibă minimum 8 caractere.</p><label>Parolă nouă<input id="newPwd" class="field" type="password" autocomplete="new-password" minlength="8"></label><label>Confirmă parola<input id="confirmPwd" class="field" type="password" autocomplete="new-password" minlength="8"></label><div class="footer-actions">${invitation ? '' : '<button class="soft" onclick="closeModal()">Anulează</button>'}<button class="black" onclick="finishPasswordChange()">Salvează parola</button></div>`);
  };

  window.finishPasswordChange = async function () {
    const password = q('newPwd').value;
    if (password.length < 8) {
      toast('Parola trebuie să conțină minimum 8 caractere.');
      return;
    }
    if (password !== q('confirmPwd').value) {
      toast('Parolele introduse nu coincid.');
      return;
    }
    try {
      await cloud.updatePassword(password);
      closeModal();
      toast('Parola a fost salvată. Contul este gata.');
    } catch (error) {
      console.error('Schimbare parolă Supabase:', error);
      toast('Parola nu a putut fi salvată. Deschide din nou linkul invitației.');
    }
  };

  resetDb = async function () {
    if (!confirm('Sigur resetați toate datele acestei clinici la starea demonstrativă?')) return;
    db = JSON.parse(JSON.stringify(seed));
    await save();
    closeModal();
    refreshActiveView();
    toast('Datele clinicii au fost resetate.');
  };

  (async function bootstrapSupabase() {
    showLoginGate();
    const restored = await cloud.restoreSession();
    if (restored) {
      await loadFromSupabase();
      if (cloud.authEvent === 'invite' || cloud.authEvent === 'recovery') changePassword(true);
    } else {
      updateDbBadge('offline', 'Autentificare necesară');
    }
  })();
})();
</script>
